    <rect x="0" y="0" width="150" height="34" rx="10" fill="#0a66c2" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Object LinkedIn</text>
    <text x="75" y="60" text-anchor="middle" font-size="22">💼</text>
    <text x="75" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93c5fd">Workplace Life</text>
    <text x="75" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Corporate Role</text>
    <text x="75" y="123" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Career Timeline</text>
    <text x="75" y="141" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Thought Posts</text>
    <text x="75" y="159" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Coworker Network</text>
  </g>

  <!-- MODULE 3: OBJECT MATRIMONY -->
  <g transform="translate(425, 385)" filter="url(#shadow)">
    <rect width="150" height="190" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#9d174d" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Object Matrimony</text>
    <text x="75" y="60" text-anchor="middle" font-size="22">💍</text>
    <text x="75" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fbcfe8">Soulmate Search</text>
    <text x="75" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• 10-Porutham Match</text>
    <text x="75" y="123" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Appliance Profiles</text>
    <text x="75" y="141" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• In-Law Background</text>
    <text x="75" y="159" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Proposal Rituals</text>
  </g>

  <!-- MODULE 4: ASTROLOGY & DESTINY -->
  <g transform="translate(630, 385)" filter="url(#shadow)">
    <rect width="150" height="190" rx="10" fill="url(#cardGrad)" stroke="#eab308" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#854d0e" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Astrology &amp; Astro</text>
    <text x="75" y="60" text-anchor="middle" font-size="22">🔮</text>
    <text x="75" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fef08a">Cosmic Horoscopes</text>
    <text x="75" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Zodiac Sign &amp; Element</text>
    <text x="75" y="123" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Lucky Socket / Room</text>
    <text x="75" y="141" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Daily Planetary Transit</text>
    <text x="75" y="159" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Destiny Forecast</text>
  </g>

  <!-- MODULE 5: THING COURT & NEWS -->
  <g transform="translate(835, 385)" filter="url(#shadow)">
    <rect width="150" height="190" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.2" />
    <rect x="0" y="0" width="150" height="34" rx="10" fill="#991b1b" />
    <text x="75" y="22" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Thing Court &amp; News</text>
    <text x="75" y="60" text-anchor="middle" font-size="22">⚖️</text>
    <text x="75" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Justice &amp; Drama</text>
    <text x="75" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Domestic Lawsuits</text>
    <text x="75" y="123" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Witness Testimonies</text>
    <text x="75" y="141" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Jury Verdicts</text>
    <text x="75" y="159" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Breaking Thing News</text>
