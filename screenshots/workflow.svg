  <path d="M 295 350 L 295 380" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowTeal)" />
  <path d="M 500 350 L 500 380" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowTeal)" />
  <path d="M 705 350 L 705 380" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowTeal)" />
  <path d="M 910 350 L 910 380" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrowTeal)" />

