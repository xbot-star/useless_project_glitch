    <text x="75" y="105" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Human Name</text>
    <text x="75" y="123" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94a3b8">• Personality DNA</text>
